<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mausam India — Live Weather & AQI Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: linear-gradient(135deg, #0b1329 0%, #111d40 100%);
      --card-bg: rgba(15, 23, 42, 0.75);
      --border: rgba(255, 255, 255, 0.12);
      --tx: #f8fafc;
      --mu: #94a3b8;
      --ac: #38bdf8;
    }
    html.light {
      --bg: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --border: rgba(148, 163, 184, 0.25);
      --tx: #0f172a;
      --mu: #64748b;
      --ac: #0284c7;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--tx);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      -webkit-font-smoothing: antialiased;
    }
    .widget-card {
      width: 100%;
      height: 100%;
      max-width: 320px;
      max-height: 190px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
    }
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .location-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      color: var(--tx);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }
    .loc-icon { color: var(--ac); font-size: 14px; }
    .widget-brand {
      font-size: 10px;
      font-weight: 700;
      color: var(--mu);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }
    .widget-brand:hover { color: var(--ac); }
    .main-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0;
    }
    .temp-group { display: flex; align-items: baseline; gap: 4px; }
    .temp-val { font-size: 38px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
    .temp-unit { font-size: 18px; font-weight: 600; color: var(--mu); }
    .weather-glyph { font-size: 34px; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2)); }
    .condition-text {
      font-size: 11.5px;
      color: var(--mu);
      font-weight: 500;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .feels-text { color: var(--tx); font-weight: 600; }
    .widget-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
    .badge-pill {
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .aqi-pill {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .rain-pill {
      background: rgba(56, 189, 248, 0.15);
      color: var(--ac);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .loading-state, .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: var(--mu);
      font-size: 12px;
      gap: 8px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid var(--border);
      border-top-color: var(--ac);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="widget-card" id="widgetCard">
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <span>Loading Mausam India...</span>
    </div>
  </div>

  <script src="widget-view.js"></script>
</body>
</html>
