<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>404 – Page Not Found · Mausam India</title>
    <meta name="description" content="This weather link or coordinate could not be found on Mausam India." />
    <link rel="icon" type="image/svg+xml" href="./assets/mausam-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --tx: #0f172a;
        --mu: #475569;
        --bg1: #bae6fd;
        --bg2: #fef3c7;
        --card: rgba(255, 255, 255, 0.65);
        --bd: rgba(255, 255, 255, 0.75);
        --ac: #ea580c;
        --f: "Figtree", system-ui, -apple-system, sans-serif;
        --d: "Fraunces", Georgia, serif;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --tx: #f1f5f9;
          --mu: #9fb0c6;
          --bg1: #090e1a;
          --bg2: #162447;
          --card: rgba(15, 23, 42, 0.72);
          --bd: rgba(255, 255, 255, 0.12);
          --ac: #fb923c;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font: 400 15px/1.6 var(--f);
        color: var(--tx);
        background: radial-gradient(circle at 50% 20%, var(--bg2), var(--bg1) 85%);
        background-attachment: fixed;
      }
      .error-card {
        width: min(520px, 100%);
        padding: clamp(28px, 6vw, 44px);
        border-radius: 28px;
        background: var(--card);
        border: 1px solid var(--bd);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(28px) saturate(1.4);
        -webkit-backdrop-filter: blur(28px) saturate(1.4);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .logo-mark {
        width: 64px;
        height: 64px;
        filter: drop-shadow(0 4px 12px color-mix(in srgb, var(--ac) 45%, transparent));
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        background: color-mix(in srgb, var(--ac) 15%, transparent);
        color: var(--ac);
        border: 1px solid color-mix(in srgb, var(--ac) 30%, transparent);
      }
      h1 {
        font: 600 clamp(48px, 10vw, 72px)/1 var(--d);
        letter-spacing: -0.04em;
        color: var(--tx);
      }
      h2 {
        font: 600 clamp(18px, 3.5vw, 22px)/1.3 var(--d);
        letter-spacing: -0.01em;
        color: var(--tx);
      }
      p {
        color: var(--mu);
        font-size: 14px;
        max-width: 420px;
      }
      .btn-return {
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 14px;
        background: var(--ac);
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        box-shadow: 0 6px 20px color-mix(in srgb, var(--ac) 40%, transparent);
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      .btn-return:hover {
        transform: translateY(-2px);
        opacity: 0.95;
      }
      footer {
        margin-top: 24px;
        font-size: 12px;
        color: var(--mu);
        text-align: center;
      }
      footer a {
        color: inherit;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="error-card">
      <svg class="logo-mark" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="errSun" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fffbeb"/>
            <stop offset="25%" stop-color="#fde047"/>
            <stop offset="65%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#ea580c"/>
          </radialGradient>
          <linearGradient id="errCloud" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#cbd5e1"/>
          </linearGradient>
        </defs>
        <circle cx="56" cy="50" r="34" fill="url(#errSun)"/>
        <path d="M42 98h50a22 22 0 0 0 4.8-43.5 26 26 0 0 0-49.6-7.4A20 20 0 0 0 42 98z" fill="url(#errCloud)"/>
        <path d="M26 98h10" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <span class="badge">404 · Out of Orbit</span>
      <h1>404</h1>
      <h2>Ye mausam rasta bhatak gaya</h2>
      <p>
        The page, town coordinate, or weather stream you requested does not exist or has drifted away.
      </p>
      <a href="./" class="btn-return">← Return to Live Forecast</a>
    </main>
    <footer>
      © 2026 Mausam India · Independent Open-Source Weather Platform
    </footer>
  </body>
</html>
