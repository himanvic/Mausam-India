<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Mausam India Sun &amp; Cloud Logo</title>
  <defs>
    <!-- Radiant Golden Sun Gradient -->
    <radialGradient id="sunGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <!-- Soft Weather Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <!-- Atmospheric Ambient Glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <rect width="128" height="128" rx="32" fill="#0b1329" fill-opacity="0.05"/>

  <!-- Sun Orb with Radiance -->
  <circle cx="56" cy="50" r="34" fill="url(#sunGlow)" filter="url(#softGlow)"/>

  <!-- Crisp Weather Cloud Overlay -->
  <path d="M42 98h50a22 22 0 0 0 4.8-43.5 26 26 0 0 0-49.6-7.4A20 20 0 0 0 42 98z" 
        fill="url(#cloudGrad)" 
        filter="drop-shadow(0 6px 14px rgba(15, 23, 42, 0.28))"/>

  <!-- Dynamic Breeze Vector (Subtle Teal Stream) -->
  <path d="M26 98h10" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round"/>
  <path d="M18 90h8" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
</svg>
